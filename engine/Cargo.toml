[package]
name = "engine"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }

engine_core = { path = "../core/" }
threading = { path = "../threading/" }

assets    = { path = "../assets/",    optional = true }
gltf      = { path = "../gltf/",      optional = true }
rendering = { path = "../rendering/", optional = true }
ui        = { path = "../ui/",        optional = true }

# window feature pulls in winit + pollster directly (no separate window crate needed)
winit     = { workspace = true,        optional = true }
pollster  = { version = "1.0.1",       optional = true }
ultraviolet = { workspace = true }

[features]
default  = []
assets   = ["dep:assets"]
gltf     = ["dep:gltf", "dep:assets", "assets"]
window   = ["dep:rendering", "dep:winit", "dep:pollster", "assets"]
ui       = ["dep:ui", "window"]
full     = ["assets", "gltf", "window", "ui"]
debug    = ["window", "ui", "rendering/debug"]
