[package]
name = "ui"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"

[lints]
workspace = true

[dependencies]
egui     = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
egui-wgpu = "0.37"
arboard  = { version = "3.4.1", default-features = false }
wgpu     = { version = "30", features = ["wgsl"] }

engine_core = { path = "../core/" }
