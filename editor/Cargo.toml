[package]
name = "editor"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[lints]
workspace = true

[dependencies]
anyhow      = { workspace = true }
log         = { workspace = true }
env_logger  = { version = "0.11.10" }
ultraviolet = { workspace = true }

engine      = { path = "../engine/",    features = ["full", "debug"] }
engine_core = { path = "../core/" }
rendering   = { path = "../rendering/" }
project     = { path = "../project/" }

gltf-api   = { package = "gltf", version = "1.4.1", features = ["names", "extras", "extensions", "KHR_lights_punctual"] }
egui       = { version = "0.37" }
rfd        = "0.17"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
notify     = "8"
