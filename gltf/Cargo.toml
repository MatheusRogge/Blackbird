[package]
name = "gltf"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[lints]
workspace = true

[dependencies]
gltf = { version = "1.4.1", features = [
  "extras",
  "names",
  "import",
  "utils",
  "guess_mime_type",
] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
urlencoding = "2.1"

thiserror = { workspace = true }
tracing = { workspace = true }
log = { workspace = true }

assets = { path = "../assets/" }
engine_core = { path = "../core/" }
rendering = { path = "../rendering/" }
