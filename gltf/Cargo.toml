[package]
name = "gltf"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[lints]
workspace = true

# The crate shares its name with the upstream `gltf` it depends on, so rustdoc finds two `gltf`
# rlibs and can't build doctests. There are none.
[lib]
doctest = false

[dependencies]
gltf = { version = "1.4.1", features = [
  "extras",
  "names",
  "import",
  "utils",
  "guess_mime_type",
  "KHR_lights_punctual",
  "KHR_materials_emissive_strength",
] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
urlencoding = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

thiserror = { workspace = true }
tracing = { workspace = true }
log = { workspace = true }
ultraviolet = { workspace = true }

assets = { path = "../assets/" }
engine_core = { path = "../core/" }
rendering = { path = "../rendering/" }
