[package]
name = "sandbox"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { version = "0.11.10" }
ultraviolet = { workspace = true }

engine      = { path = "../engine/",     features = ["full", "debug"] }
engine_core = { path = "../core/" }
rendering   = { path = "../rendering/", features = ["rendering_2d"] }
