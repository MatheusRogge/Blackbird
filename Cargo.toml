[workspace]
resolver = "2"
members = [
  "core",
  "assets",
  "build_tool",
  "editor",
  "engine",
  "gltf",
  "player",
  "project",
  "rendering",
  "sandbox",
  "threading",
  "ui",
]

[workspace.dependencies]
anyhow = { version = "1.0.102" }
log = { version = "0.4.29" }
thiserror = { version = "2.0.18" }
tracing = { version = "0.1.44" }
winit = { version = "0.30.13" }
slotmap = { version = "1.1.1" }
ultraviolet = { version = "0.10.0", features = ["int", "f64"] }

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

# wgpu and naga cost several times more CPU per draw unoptimized; workspace crates stay debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Standalone game builds made by `build_tool`.
[profile.development]
inherits = "dev"
opt-level = 1

[profile.production]
inherits = "release"
panic = "abort"
