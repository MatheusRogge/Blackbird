[package]
name = "rendering"
version = "1.0.0"
edition = "2024"
rust-version = "1.96"

[lints]
workspace = true

[features]
default = ["rendering_2d"]
rendering_2d = []
debug = ["dep:egui", "dep:ui"]

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
wgpu = { version = "29.0.1", features = ["wgsl"] }

log = { workspace = true }
thiserror = { workspace = true }
ultraviolet = { workspace = true }

assets = { path = "../assets/" }
engine_core = { path = "../core/" }

egui = { version = "0.34", optional = true }
ui   = { path = "../ui/", optional = true }
